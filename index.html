<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تاج العروس | هدايا الزفاف والعرسان</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- خلفية الورود الذهبية المتوهجة -->
  <div id="floating-flowers"></div>

  <!-- موسيقى خلفية افتراضية -->
  <audio id="bg-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" autoplay loop></audio>

  <!-- الهيدر -->
  <header class="hero">
    <img src="images/a2.png" class="logo" alt="شعار تاج العروس" />
    <h1>تاج العروس للهدايا والزفاف</h1>
    <p>كل ما يحلم به العرسان... في مكان واحد ✨</p>
    <button onclick="scrollToSection('products')">تصفح الهدايا</button>
  </header>

  <!-- عن المتجر -->
  <section id="about" class="section fade">
    <h2>عن تاج العروس</h2>
    <p>
      متجر متخصص بهدايا العرسان، الزفاف، الزينة، التحف، والورود الطبيعية والصناعية.
      نقدم منتجات فاخرة تجعل لحظاتكم لا تُنسى.
    </p>
    <img src="images/a3.jpg" class="shop-img" alt="صورة المتجر" />
  </section>

  <!-- الهدايا -->
  <section id="products" class="section fade">
    <h2>منتجاتنا</h2>
    <div class="gallery">
      <img src="images/a4.jpg" alt="هدية" />
      <img src="images/a5.jpg" alt="ورد" />
      <img src="images/a6.jpg" alt="تحف" />
      <img src="images/a7.jpg" alt="هدايا" />
    </div>
  </section>

  <!-- التواصل -->
  <section id="contact" class="section fade">
    <h2>تواصل معنا</h2>
    <p>📍 صنعاء - شارع حدة<br>📞 775758965</p>
  </section>

  <footer>
    <p>© 2025 تاج العروس | كل الحقوق محفوظة</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
